name: Сборка установщика для Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Onyx-Setup
          path: |
            dist/Onyx-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
      # Для автообновления в релизе нужны exe, latest.yml и blockmap.
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Onyx-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
